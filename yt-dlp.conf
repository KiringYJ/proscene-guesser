# Keep project downloads deterministic and separate from user-level settings.
--ignore-config
--no-playlist
--js-runtimes node

# Media is temporary authoring input and must not enter Git by accident.
--paths home:.media/downloads
--paths temp:.media/tmp
--output "%(title).180B [%(id)s].%(ext)s"
--write-info-json

# Let yt-dlp use the system FFmpeg binaries for stream merging and cutting.
--merge-output-format mkv
